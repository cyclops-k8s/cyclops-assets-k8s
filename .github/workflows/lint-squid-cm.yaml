name: Lint squid-cm.yaml
run-name: Lint squid-cm.yaml

on:
  pull_request:
    paths:
    - manifests/squid-cm.yaml
  push:
    branches:
    - main
    paths:
    - manifests/squid-cm.yaml
  workflow_dispatch:

env:
  MANIFEST: manifests/squid-cm.yaml

permissions:
  contents: read

jobs:
  parse-squid-conf:
    name: Validate squid.conf

    runs-on:
      group: Default

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Create temporary Root CA and Squid Certificates
      run: |
        mkdir squid-certs
        openssl genrsa -out squid-certs/ca.key 4096
        openssl req -x509 -new -key squid-certs/ca.key -days 1 -out squid-certs/ca.crt -subj "/CN=Temporary Root CA"
        openssl genrsa -out squid-certs/tls.key 4096
        openssl req -new -key squid-certs/tls.key -out squid-certs/tls.csr -subj "/CN=Temporary Squid Certificate"
        openssl x509 -req -in squid-certs/tls.csr -CA squid-certs/ca.crt -CAkey squid-certs/ca.key -out squid-certs/tls.crt -days 1

    - name: Get Squid Config
      run: awk '/^  squid.conf:/ {flag=1; next} /^[[:space:]]{0,2}[^[:space:]]/ {flag=0} flag' "${MANIFEST}" | sed 's/    //g' > squid-certs/temporary_squid.conf

    - name: Validate and Lint Squid Config
      run: |
        chmod -R go+r squid-certs
        docker run --cap-drop ALL --entrypoint squid --read-only --rm --mount type=bind,source=$(pwd)/squid-certs,target=/squid-certs quay.io/cyclops-k8s/squid:latest -k parse -f /squid-certs/temporary_squid.conf
