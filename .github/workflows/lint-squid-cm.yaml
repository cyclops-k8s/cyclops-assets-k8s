name: Lint squid-cm.yaml
run-name: Lint squid-cm.yaml

on:
  pull_request:
    paths:
    - manifests/squid-cm.yaml
  push:
    branches:
    - main
    paths:
    - manifests/squid-cm.yaml
  workflow_dispatch:

env:
  # Relative path to the manifest file containing the squid.conf ConfigMap in this repo.
  MANIFEST: manifests/squid-cm.yaml
  # This is the directory where temporary Squid certificates will be referenced in the configMap.
  # It should match the path used in the squid.conf for tls-cert and tls-key.
  # Do not put a leading or trailing slash in this path.
  SQUID_CERTS_DIR: squid-certs
  # The container that runs the squid pod, so the linting is performed with the same squid version.
  # This ensures consistency between the linting environment and the actual deployment.
  SQUID_CONTAINER: quay.io/cyclops-k8s/squid:latest

permissions:
  contents: read

jobs:
  parse-squid-conf:
    name: Validate squid.conf

    runs-on:
      group: Default

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Create temporary Root CA and Squid Certificates
      run: |
        mkdir "${SQUID_CERTS_DIR}"
        openssl genrsa -out "${SQUID_CERTS_DIR}/ca.key" 4096
        openssl req -x509 -new -key "${SQUID_CERTS_DIR}/ca.key" -days 1 -out "${SQUID_CERTS_DIR}/ca.crt" -subj "/CN=Temporary Root CA"
        openssl genrsa -out "${SQUID_CERTS_DIR}/tls.key" 4096
        openssl req -new -key "${SQUID_CERTS_DIR}/tls.key" -out "${SQUID_CERTS_DIR}/tls.csr" -subj "/CN=Temporary Squid Certificate"
        openssl x509 -req -in "${SQUID_CERTS_DIR}/tls.csr" -CA "${SQUID_CERTS_DIR}/ca.crt" -CAkey "${SQUID_CERTS_DIR}/ca.key" -out "${SQUID_CERTS_DIR}/tls.crt" -days 1

    - name: Extract Squid Config from ConfigMap
      run: awk '/^  squid.conf:/ {flag=1; next} /^[[:space:]]{0,2}[^[:space:]]/ {flag=0} flag' "${MANIFEST}" | sed 's/^    //g' > "${SQUID_CERTS_DIR}/temporary_squid.conf"

    - name: Validate and Lint Squid Config
      run: |
        chmod -R go+r "${SQUID_CERTS_DIR}"
        docker run --cap-drop ALL --entrypoint squid --read-only --rm --mount type=bind,source=$(pwd)/"${SQUID_CERTS_DIR}",target=/"${SQUID_CERTS_DIR}" "${SQUID_CONTAINER}" -k parse -f /"${SQUID_CERTS_DIR}"/temporary_squid.conf
